# Platform component 10-local-secrets-provider: the OKDP chart local-secrets-provider (packages/system/local-secrets-provider).
#   instance.yaml: {name: local-secrets-provider, project: okdp-system, service: local-secrets-provider,
# TODO(no-kubocd): temporary registry, revert to quay.io/okdp once the OKDP charts are published there.
#                   chart: oci://repo.alliage.io:8082/okdp/sandbox-charts/local-secrets-provider,
#                   version: "1.0.0-1.0.0", connections: []}
# Secrets replicated to every namespace (kubernetes-replicator of 00-tools):
# - creds-keycloak-db: owner of the keycloak database (20-cnpg-postgresql) and the secretRef
#   of Keycloak's database connection (20-keycloak); label cnpg.io/reload, as every
#   database owner Secret;
# - creds-seaweedfs-s3: the platformAdmin identity of the object store (20-storage) and the
#   secretRef of the projects' s3 connection files (was a plain Secret next to the
#   optional storage Release).
secrets:
- name: creds-keycloak-db
  # CloudNativePG sets the role password when the (replicated) Secret appears or
  # changes only with this label (cnpg-postgresql README).
  labels:
    cnpg.io/reload: "true"
  data:
    username: keycloak
    password: keycloak123
- name: creds-seaweedfs-s3
  data:
    accessKey: snu8yoP6QAlY0ne4
    secretKey: PNzBcmeLNEdR0oviwm04NQAicOrDH1Km
