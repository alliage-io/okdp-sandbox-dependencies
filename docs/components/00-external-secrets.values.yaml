# Platform component 00-external-secrets: the upstream chart, no OKDP wrapper.
#   instance.yaml: {name: external-secrets, project: external-secrets, service: external-secrets,
#                   chart: oci://ghcr.io/external-secrets/charts/external-secrets,
#                   version: "2.11.0", connections: []}
# Former KuboCD package sandbox-dependencies/external-secrets 0.15.1-1.0.1 (module main),
# its parameters installCRDs/webhookEnabled/certControllerEnabled/imageRepository
# expanded to the upstream keys below.
#
# ESO 2.x serves external-secrets.io/v1 only (v1beta1 is no longer served:
# crds.unsafeServeV1Beta1 stays false), the version okdp-lib-chart and the charts render;
# generators.external-secrets.io stays v1alpha1. A cluster still running 0.15 has its
# objects stored as v1beta1: follow the upstream upgrade path (a release serving both
# versions, the stored objects rewritten as v1) or recreate the objects. 2.0 also
# removed the Alibaba and Device42 providers.
installCRDs: true
crds:
  # The v1alpha1 conversion webhook is gone upstream (off by default since 1.0).
  conversion:
    enabled: false
  # Kept on uninstall; deletion is also refused by the tools chart
  # (protection.crdGroups: external-secrets.io).
  annotations:
    helm.sh/resource-policy: keep
# Controllers labelled for the tools chart's deletion protection (former protected: true).
commonLabels:
  okdp.io/protected: "true"
# Images: the chart's default registry is ghcr.io (the former oci.external-secrets.io
# mirror, blocked by some corporate proxies, is no longer the default).
webhook:
  create: true
certController:
  create: true
