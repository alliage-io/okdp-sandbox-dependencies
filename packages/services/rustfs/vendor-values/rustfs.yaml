# Fixed values of the vendored rustfs chart (vendor/rustfs), merged over its
# values.yaml and under the values computed by templates/_values.tpl
# (okdp.vendor.render "valuesFile"). Plain YAML, not a template.
# Single node (standalone).
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false
replicaCount: 1
resources:
  requests:
    memory: 512Mi
storageclass:
  logStorageSize: 256Mi
# The upstream ingress targets the console port only: both ingresses (S3 API
# and console) are templates of this chart.
ingress:
  enabled: false
