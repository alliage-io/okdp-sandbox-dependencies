apiVersion: v2
name: rustfs
description: >-
  RustFS, a high-performance S3-compatible object store written in Rust: a
  single-node alternative to seaweedfs as the platform object store, with buckets,
  S3 identities and OIDC sign-in provisioned from its parameters. Publishes one s3
  connection.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 1.0.0-1.0.0
appVersion: "1.0.0"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-dependencies
  - https://github.com/rustfs/rustfs
  - oci://quay.io/adaltas/oidc-dcr
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: storage
  okdp.io/depends-on: "ingress,external-secrets"
dependencies:
  - name: okdp-lib
    version: ">=0.1.0 <1.0.0"
    # TODO(no-kubocd): switch to oci://quay.io/okdp/platform-charts
    repository: file://../../../../okdp-lib
