{{- /*
Root identity, generated once in the cluster (ESO Password generator) unless
rootSecretKey is set. The keys are the ones the server reads (envFrom).
*/}}
{{- if not .Values.rootSecretKey }}
{{ include "okdp.generatedSecret" (dict "ctx" . "name" (include "okdp-rustfs.rootSecret" .)
     "keys" (list (dict "key" "RUSTFS_SECRET_KEY" "length" 40 "symbols" 0))
     "stringData" (dict "RUSTFS_ACCESS_KEY" .Values.rootAccessKey)) }}
{{- end }}
