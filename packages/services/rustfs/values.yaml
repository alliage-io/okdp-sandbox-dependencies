# Platform values (platform/platform-values.yaml). Never set per instance.
# Read here: ingress.{suffix,className}, certificateIssuers.selfSigned.name,
# storageClass.data, oidc.{enabled,issuerUri,displayName,scope,clientProvisioning,dcr}.
global:
  okdp: {}

# External connections (none used by this chart).
connections: {}

# Root (admin) identity of the store.
rootAccessKey: okdpadmin
# Empty: generated once by an ESO Password generator (Secret <release>-root).
# Set it only if you must know it in advance: values are stored in Git.
rootSecretKey: ""

# Host names (ingress suffix appended). Default: <instance>-<namespace>[-api], the
# instance being the release name without its "<namespace>-" prefix.
consoleHost: ""
apiHost: ""

# Data volume size.
dataStorage: 5Gi
# Secret holding ca.crt, trusted by the server when it calls the OIDC issuer.
caBundleSecret: certs-bundle
# Memory limit of the server container (GiB).
memoryGi: 2
# CPU request of the server container (vCPU); the limit is twice this value.
cpu: 0.25

# S3 identities of the store, one entry per principal:
#   - principal: spark                     # policy okdp-<principal>
#     credentialsSecret: {name: creds-spark-s3, accessKeyKey: accessKey, secretKeyKey: secretKey}
#     actions: [read, list, write]         # neutral verbs: read, list, write, admin
#     buckets: [lake]                      # default: every bucket
#     sts: false                           # true: full admin rights (consoleAdmin)
grants: []
# Buckets created at startup; paths seeds empty prefixes (a .keep object).
#   - {name: lake, anonymousRead: false, paths: [spark-events]}
buckets: []
# Policies named after the values of the OIDC policy claim:
#   - {name: data_engineer, actions: [read, list, write], buckets: [lake]}
oidcPolicies: []
# Claim carrying the policy names. Every one of its values must name an
# existing policy or the login is refused.
oidcPolicyClaim: groups
# Scope requested on top of the platform scopes so the policy claim is issued
# (read only when global.okdp.oidc.clientProvisioning is dcr).
oidcPolicyScope: ""

# secretRef of the published s3 connection: an identity of this store (the
# credentialsSecret of a grant). Empty: <release>-s3-credentials, generated by ESO
# and granted read, list and write on every bucket.
outputSecretRef: ""

# Values of the upstream rustfs chart, merged over the ones computed from the
# parameters above (templates/_values.tpl, okdp-rustfs.upstream.rustfs): any
# upstream value can be set except the protected ones, e.g.
#   upstream:
#     rustfs:
#       image: {rustfs: {repository: mirror.example.org/rustfs/rustfs}}
#       tolerations: [{key: dedicated, operator: Exists, effect: NoSchedule}]
upstream: {}
