# Fixed values of the vendored seaweedfs chart (vendor/seaweedfs), merged over
# its values.yaml and under the values computed by templates/_values.tpl
# (okdp.vendor.render "valuesFile"). Plain YAML, not a template.
global:
  seaweedfs:
    image:
      name: chrislusf/seaweedfs
    # Off (upstream default): the security ConfigMap reads the cluster with lookup.
    enableSecurity: false
master:
  enabled: true
  replicas: 1
  data:
    type: persistentVolumeClaim
  logs:
    type: persistentVolumeClaim
volume:
  enabled: true
  # The resize hook compares the PVCs with lookup: off, resize by hand.
  resizeHook:
    enabled: false
filer:
  enabled: true
  replicas: 1
  enablePVC: true
  port: 8888
  data:
    type: persistentVolumeClaim
  logs:
    type: persistentVolumeClaim
  ingresses:
    http:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "130m"
        nginx.ingress.kubernetes.io/auth-type: basic
        nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
      path: "/"
      pathType: Prefix
s3:
  enabled: true
  enableAuth: true
  extraVolumeMounts: |
    - name: auth-config
      mountPath: /etc/seaweed/iam
      readOnly: true
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "130m"
    path: "/"
    pathType: Prefix
