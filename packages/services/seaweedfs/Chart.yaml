apiVersion: v2
name: seaweedfs
description: >-
  SeaweedFS, a simple and highly scalable distributed file system with an S3 API: the
  platform object store. Publishes one s3 connection; each consumer brings its own
  identity (grants), whose keys ESO collects into the S3 configuration.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 4.47.0-1.0.0
appVersion: "4.47.0"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-dependencies
  - https://github.com/seaweedfs/seaweedfs
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: storage
  okdp.io/depends-on: "ingress,external-secrets"
dependencies:
  - name: okdp-lib-chart
    version: ">=0.3.0 <1.0.0"
    repository: oci://quay.io/okdp
