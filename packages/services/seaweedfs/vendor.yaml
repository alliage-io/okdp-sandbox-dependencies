# Upstream charts rendered by okdp.vendor.render (templates/*.yaml).
# vendor/ is downloaded, not committed: scripts/vendor-charts.sh packages/services/seaweedfs
charts:
  - name: seaweedfs
    repository: https://seaweedfs.github.io/seaweedfs/helm
    version: 4.47.0
    # A pre-install hook Secret with a random password (randAlphaNum), unused with
    # the default filer store (the filer reads it with optional: true); Argo CD
    # would recreate it with a new value on every sync, and no value disables it.
    drop: [templates/shared/secret-seaweedfs-db.yaml]
