apiVersion: v2
name: vault
description: >-
  HashiCorp Vault, the secret backend a project SecretStore points at. Runs in dev
  mode by default, which unseals itself and keeps everything in memory.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 0.34.1-1.0.0
appVersion: "0.34.1"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-dependencies
  - https://github.com/hashicorp/vault-helm
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: secret-backend
  okdp.io/depends-on: "ingress"
dependencies:
  - name: okdp-lib-chart
    version: ">=0.3.0 <1.0.0"
    repository: oci://quay.io/okdp
