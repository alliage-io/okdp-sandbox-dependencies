# Platform values (platform/platform-values.yaml). Never set per instance.
# Reads global.okdp.ingress.{suffix,className} and certificateIssuers.selfSigned.name.
global:
  okdp: {}

# External connections (none used by this chart).
connections: {}

# Dev mode: unsealed in-memory server, root token "root", emptied on restart. Sandbox
# only: set dev: true explicitly there. Off (default), Vault starts sealed with file
# storage (standalone): initialise and unseal it (vault operator init / unseal).
dev: false
# Host name, the platform ingress suffix is appended.
ingressHost: vault
uiEnabled: true
# Label the StatefulSet and the injector okdp.io/protected=true (former KuboCD protected).
protected: true

# Values of the upstream vault chart, merged over the ones computed from the
# parameters above (templates/_values.tpl, vault.upstream): any upstream value
# can be set except the protected ones, e.g.
#   upstream:
#     vault:
#       server:
#         resources: {limits: {memory: 512Mi}}
#         dataStorage: {size: 20Gi}
upstream: {}
