# Platform values (platform/platform-values.yaml). Never set per instance.
global:
  okdp: {}

# External connections (none used by this chart).
connections: {}

# Secrets to provision, each replicated to every namespace:
#   - name: creds-keycloak-db
#     data: {username: keycloak, password: keycloak123}
#     labels: {cnpg.io/reload: "true"}   # optional; copied to the replicas
# Values cannot be empty: nothing generates them (use ESO for generated passwords).
secrets: []

# Values of the upstream chart, merged over the ones computed from the
# parameters above (templates/_values.tpl, local-secrets-provider.upstream):
# any upstream value can be set except the protected ones, e.g.
#   upstream:
#     local-secrets-provider:
#       nameOverride: secrets
upstream: {}
