apiVersion: v2
name: local-secrets-provider
description: >-
  Provisions the Kubernetes Secrets the platform services need from a static list: a
  local stand-in for an external secret manager in sandbox environments. Each Secret
  is replicated to every namespace (kubernetes-replicator, tools chart).
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 1.0.0-1.0.0
appVersion: "1.0.0"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-dependencies
  - https://github.com/OKDP/helm-charts-utilities
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: external-secrets
  okdp.io/depends-on: "tools"
dependencies:
  - name: okdp-lib-chart
    version: ">=0.1.0 <1.0.0"
    repository: oci://quay.io/okdp
