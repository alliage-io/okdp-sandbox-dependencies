# Platform values (platform/platform-values.yaml). Never set per instance.
# Reads global.okdp.ingress.suffix.
global:
  okdp: {}

# External connections (none used by this chart).
connections: {}

# Address returned for every name under the ingress suffix (IPv4, or IPv6).
target: "127.0.0.1"
# Node port, UDP and TCP.
nodePort: 30053
# Upstream DNS servers for every other name.
forwarders:
  - 8.8.8.8
  - 8.8.4.4
