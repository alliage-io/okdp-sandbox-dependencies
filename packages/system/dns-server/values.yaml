# Platform values (platform/platform-values.yaml). Never set per instance.
# Reads global.okdp.ingress.suffix.
global:
  okdp: {}

# External connections (none used by this chart).
connections: {}

# Address returned for every name under the ingress suffix (IPv4, or IPv6).
target: "127.0.0.1"
# Node port, UDP and TCP.
nodePort: 30053
# Upstream DNS servers for every other name.
forwarders:
  - 8.8.8.8
  - 8.8.4.4

# Values of the vendored coredns chart, merged over the ones computed from the
# parameters above (templates/_values.tpl, dns-server.upstream.options): any
# upstream value can be set except the protected ones, e.g.
#   upstream:
#     coredns:
#       image: {repository: mirror.example.org/coredns/coredns}
#       tolerations: [{key: dedicated, operator: Exists, effect: NoSchedule}]
#       servers:                     # appended to the two computed server blocks
#         - zones: [{zone: corp.example., use_tcp: true}]
#           port: 53
#           plugins: [{name: forward, parameters: . 10.0.0.53}]
upstream: {}
