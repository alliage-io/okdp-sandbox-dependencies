apiVersion: v2
name: dns-server
description: >-
  Lightweight DNS server (CoreDNS) for local development: answers the platform
  ingress suffix (*.<global.okdp.ingress.suffix>) with a fixed address, forwards the
  other names, exposed on a NodePort so the host resolver can use it.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 1.47.1-1.0.0
appVersion: "1.47.1"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-dependencies
  - https://github.com/coredns/helm
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: dns-server
  okdp.io/depends-on: ""
dependencies:
  - name: okdp-lib-chart
    version: ">=0.3.0 <1.0.0"
    repository: oci://quay.io/okdp
