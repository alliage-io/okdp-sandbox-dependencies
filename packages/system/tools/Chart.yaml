apiVersion: v2
name: tools
description: >-
  Miscellaneous Kubernetes tools: Reloader (restarts pods when their ConfigMaps or
  Secrets change), kubernetes-replicator (copies Secrets and ConfigMaps between
  namespaces), and the OKDP protection policy that refuses to delete objects
  labelled okdp.io/protected=true.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 1.0.0-1.0.0
appVersion: "1.0.0"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-dependencies
  - https://github.com/stakater/Reloader
  - https://github.com/mittwald/kubernetes-replicator
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: tools
  okdp.io/depends-on: ""
dependencies:
  - name: okdp-lib-chart
    version: ">=0.3.0 <1.0.0"
    # TODO(no-kubocd): temporary registry, revert to oci://quay.io/okdp/okdp-lib-chart once published there.
    repository: https://repo.alliage.io/repository/okdp-charts
