# Platform values (platform/platform-values.yaml). Never set per instance.
global:
  okdp: {}

# External connections (none used by this chart).
connections: {}

reloader:
  # Restart pods when the ConfigMaps/Secrets they use change.
  enabled: true
replicator:
  # Replicate Secrets/ConfigMaps between namespaces (replicator.v1.mittwald.de annotations).
  enabled: true

# ValidatingAdmissionPolicy refusing to delete CRDs, namespaces and controllers
# (Deployment, StatefulSet, DaemonSet) labelled <label>=true. Replaces the KuboCD
# `protected: true`. To delete such an object, remove the label first.
protection:
  enabled: true
  label: okdp.io/protected
  # CRDs of these API groups (and their subgroups, e.g. acme.cert-manager.io) are
  # protected whatever their labels: upstream charts used directly from
  # platform/components (external-secrets, cloudnative-pg) cannot label them.
  crdGroups:
    - cert-manager.io
    - external-secrets.io
    - postgresql.cnpg.io

# Values of the upstream charts, merged over the ones computed from the
# parameters above (templates/_values.tpl, tools.*.upstream): any upstream
# value can be set except the protected ones, e.g.
#   upstream:
#     reloader:
#       reloader: {logLevel: debug, deployment: {resources: {limits: {memory: 128Mi}}}}
#     kubernetes-replicator:
#       tolerations: [{key: dedicated, operator: Exists, effect: NoSchedule}]
upstream: {}
