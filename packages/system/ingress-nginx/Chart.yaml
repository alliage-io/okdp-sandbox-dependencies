apiVersion: v2
name: ingress-nginx
description: >-
  NGINX Ingress Controller for Kubernetes, in one of three deployment modes: nodePort
  (kind clusters), hostPort (host networking) or metallb (LoadBalancer on a fixed IP).
  The upstream project is retired: 4.15.1 is its final release.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 4.15.1-1.0.0
appVersion: "4.15.1"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-dependencies
  - https://github.com/kubernetes/ingress-nginx
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: ingress
  okdp.io/depends-on: ""
dependencies:
  - name: okdp-lib-chart
    version: ">=0.1.0 <1.0.0"
    repository: oci://quay.io/okdp
