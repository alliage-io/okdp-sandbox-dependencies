{{ include "cert-manager.protect" (dict "enabled" .Values.protected "rendered" (include "okdp.vendor.render" (dict "ctx" . "chart" "cert-manager" "valuesFile" "vendor-values/cert-manager.yaml" "upstream" (include "cert-manager.upstream.cert-manager" . | fromYaml)))) }}
