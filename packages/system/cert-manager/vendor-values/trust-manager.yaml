# Fixed values of the vendored trust-manager chart (vendor/trust-manager),
# merged over its values.yaml and under the values computed by
# templates/_values.tpl (okdp.vendor.render "valuesFile"). Plain YAML, not a
# template.
crds:
  keep: true
app:
  webhook:
    tls:
      # The webhook certificate comes from cert-manager: a Helm-generated one
      # (genCA) would change on every render.
      helmCert:
        enabled: false
image:
  repository: quay.io/jetstack/trust-manager
