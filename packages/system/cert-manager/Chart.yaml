apiVersion: v2
name: cert-manager
description: >-
  cert-manager with trust-manager and the OKDP cluster issuers: certificates for the
  platform ingresses, self-signed or CA issuers, and a CA bundle distributed to every
  namespace. One chart, installed as up to three platform components (the CRDs of a
  layer must exist before the objects of the next one are applied).
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 1.21.2-1.0.0
appVersion: "v1.21.2"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-dependencies
  - https://github.com/cert-manager/cert-manager
  - https://github.com/cert-manager/trust-manager
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: certManager
  okdp.io/depends-on: ""
dependencies:
  - name: okdp-lib-chart
    version: ">=0.3.0 <1.0.0"
    # TODO(no-kubocd): temporary registry, revert to oci://quay.io/okdp/okdp-lib-chart once published there.
    repository: https://repo.alliage.io/repository/okdp-charts
