{{- /* The admin password (upstream: common.secrets.passwords.manage, lookup + random fallback). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.adminSecret" . }}
  labels:
    {{- include "okdp.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.adminPassword | quote }}
