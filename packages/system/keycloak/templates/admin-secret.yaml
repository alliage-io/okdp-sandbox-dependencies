{{- /*
The admin password (upstream: common.secrets.passwords.manage, lookup + random fallback).
adminPassword empty (default): generated once in the cluster by an ESO Password
generator (okdp.generatedSecret), never a well-known default. Set: written as is.
*/}}
{{- if .Values.adminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.adminSecret" . }}
  labels:
    {{- include "okdp.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.adminPassword | quote }}
{{- else }}
{{ include "okdp.generatedSecret" (dict "ctx" . "name" (include "keycloak.adminSecret" .)
     "keys" (list (dict "key" "admin-password" "length" 32 "symbols" 0))) }}
{{- end }}
