name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  # Only cancel in-progress jobs or runs for the current workflow - matches against branch & tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-package-oci-prefix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      oci_package_prefix: ${{ steps.prefix.outputs.oci_package_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Get OCI package prefix
        id: prefix
        uses: ./.github/actions/oci-package-prefix
        with:
          values_path: sandbox-dependencies-values.yaml

  publish:
    needs: [get-package-oci-prefix]
    if: github.repository_owner == 'OKDP'
    permissions:
      contents: read
      packages: write
    # TODO(no-kubocd): @v1 and drop tools_ref/sibling_repositories once merged.
    # SECURITY (CI-01): @no-kubocd and tools_ref are mutable refs; pin both to
    # the same 40-hex commit SHA once the branch stops moving.
    uses: OKDP/gh-workflows/.github/workflows/okdp-chart-ci.yml@no-kubocd
    with:
      tools_ref: no-kubocd
      sibling_repositories: OKDP/okdp-lib@main
      ci_registry: "ghcr.io"
      registry: "quay.io"
      publish_to_registry: "true"
      # A published version is never overwritten: republish what is missing only.
      on_existing_tag: "skip"
      all_charts: true
      oci_package_prefix: "${{ needs.get-package-oci-prefix.outputs.oci_package_prefix }}"
      runs-on: "ubuntu-latest"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_ROBOT_TOKEN: ${{ secrets.REGISTRY_ROBOT_TOKEN }}
