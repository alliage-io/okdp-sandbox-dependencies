apiVersion: v2
name: vault
description: >-
  HashiCorp Vault, the secret backend a project SecretStore points at. Starts
  sealed with file storage by default; dev mode (sandbox only) unseals itself and
  keeps everything in memory.
type: application
# <upstream>-<okdp semver>: catalog/vault/<version>/, a new directory per version.
version: 0.34.1-1.0.0
appVersion: "0.34.1"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-dependencies
  - https://github.com/hashicorp/vault-helm
dependencies:
  # The former KuboCD module main.
  - name: vault
    repository: https://helm.releases.hashicorp.com
    version: 0.34.1
