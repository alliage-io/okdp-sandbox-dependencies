# OKDP's defaults of the kubernetes-replicator chart (okdp.yaml defaults), the same for
# every instance: over the chart's values.yaml, under the values computed
# by values.cel.yaml. Plain YAML, not a template.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
livenessProbe:
  initialDelaySeconds: 10
readinessProbe:
  initialDelaySeconds: 10
