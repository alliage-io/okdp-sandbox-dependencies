# OKDP's defaults of the reloader chart (okdp.yaml defaults), the same for
# every instance: over the chart's values.yaml, under the values computed
# by values.cel.yaml. Plain YAML, not a template.
reloader:
  deployment:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      capabilities:
        drop:
          - ALL
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
