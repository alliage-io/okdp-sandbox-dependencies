# OKDP's defaults of the ingress-nginx chart (okdp.yaml defaults), the same
# for every instance: over the chart's values.yaml, under the values computed
# by values.cel.yaml. Plain YAML, not a template.
controller:
  allowSnippetAnnotations: false
  # No --enable-ssl-passthrough: no platform Ingress uses the ssl-passthrough
  # annotation, and passthrough lets any Ingress bypass TLS termination (and the
  # controller's own L7 checks) for its host.
  admissionWebhooks:
    enabled: true
