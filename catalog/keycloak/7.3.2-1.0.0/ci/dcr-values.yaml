# Anonymous DCR on, default trusted hosts, bigger sizing, another database
# (ci/dcr-connections.yaml).
db: pg
adminPassword: s3cret-admin
ingressHost: sso
cpu: 1
memoryGi: 3.5
realm:
  name: okdp
  userProfile:
    unmanagedAttributePolicy: ADMIN_EDIT
    attributes:
      - name: department
        displayName: Department
        multivalued: true
        permissions: {view: [admin, user], edit: [admin]}
# The default allowedScopes of anonymous DCR is ["groups"]: a client scope the realm
# must declare, or keycloak-config-cli cannot import the registration policy.
# Consent kept (declared in the realm file); Full Scope Disabled removed (init container).
anonymousDCR:
  enabled: true
  consentRequired: true
clientScopes:
  - name: groups
    description: Groups scope
    protocol: openid-connect
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          full.path: "false"
          access.token.claim: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"
          claim.name: groups
