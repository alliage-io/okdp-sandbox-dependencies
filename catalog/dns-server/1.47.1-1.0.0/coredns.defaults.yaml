# OKDP's defaults of the coredns chart (okdp.yaml defaults), the same for every
# instance: over the chart's values.yaml, under the values computed by
# values.cel.yaml. Plain YAML, not a template.
# Named dns-server: the Deployment selector stays the one of the former chart.
nameOverride: dns-server
# Not the cluster DNS, no Kubernetes plugin, so no RBAC.
isClusterService: false
serviceType: NodePort
rbac:
  create: false
serviceAccount:
  create: false
replicaCount: 1
resources:
  requests:
    memory: 32Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 100m
