# OKDP's defaults of the cert-issuers chart (okdp.yaml defaults), the same for
# every instance: over the chart's values.yaml, under the values computed
# by values.cel.yaml. Plain YAML, not a template.
# The Bundle is one of OKDP's own objects (okdp.yaml objects).
bundle:
  enabled: false
# Never make the CA Secrets replicable: the upstream default (replicator,
# allowedNamespaces ".*") lets any namespace copy the CA private key
# (tls.key) with a replicate-from annotation. trust-manager reads the CA
# certificates in this namespace (see the Bundle in okdp.yaml); nothing
# needs replication.
replication:
  enabled: false
