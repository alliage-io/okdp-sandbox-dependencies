# OKDP's defaults of the cert-manager chart (okdp.yaml defaults), the same for
# every instance: over the chart's values.yaml, under the values computed
# by values.cel.yaml. Plain YAML, not a template. The former KuboCD module
# "main".
crds:
  enabled: true
  keep: true
enableCertificateOwnerRef: true
image:
  repository: quay.io/jetstack/cert-manager-controller
webhook:
  extraArgs:
    # 90 days validity instead of 7 days
    - "--dynamic-serving-leaf-duration=2160h"
