# OKDP's defaults of the trust-manager chart (okdp.yaml defaults), the same for
# every instance: over the chart's values.yaml, under the values computed
# by values.cel.yaml. Plain YAML, not a template.
# The Bundle CRD is installed with trust-manager, and kept on uninstall.
crds:
  enabled: true
  keep: true
app:
  webhook:
    tls:
      # The webhook certificate comes from cert-manager: a Helm-generated one
      # (genCA) would change on every render.
      helmCert:
        enabled: false
image:
  repository: quay.io/jetstack/trust-manager
