# The values of the rustfs chart computed from the parameters, over
# rustfs.defaults.yaml (the former KuboCD module main).
rustfs:
  nameOverride: ${{ release.name }}
  fullnameOverride: ${{ release.name }}
  resources:
    requests:
      cpu: ${{ str(values.cpu) }}
    limits:
      cpu: ${{ str(values.cpu * 2.0) }}
      memory: ${{ str(values.memoryGi) }}Gi
  storageclass:
    name: ${{ str(global.okdp.storageClass.data) }}
    dataStorageSize: ${{ str(values.dataStorage) }}
  secret:
    rustfs:
      $if: ${{ values.rootSecretKey != '' }}
      access_key: ${{ values.rootAccessKey }}
      secret_key: ${{ values.rootSecretKey }}
    # Generated by ESO (OKDP's objects, okdp.yaml).
    existingSecret:
      $if: ${{ values.rootSecretKey == '' }}
      $value: ${{ rootSecret }}
  image:
    rustfs:
      tag: ${{ imageTag }}
  # Sign-in on the console: the default provider, read from the environment
  # at startup (a provider whose discovery fails then stays off until a
  # restart).
  extraEnv:
    $if: ${{ platform.oidc.enabled }}
    $value:
      - name: RUSTFS_BROWSER_REDIRECT_URL
        value: https://${{ consoleHost }}
      # The SSRF guard refuses any origin that resolves to a private address.
      - name: RUSTFS_OUTBOUND_ALLOW_ORIGINS
        value: ${{ oidc.origin }}
      - name: SSL_CERT_FILE
        value: /cacerts/ca.crt
      - name: RUSTFS_IDENTITY_OPENID_ENABLE
        value: "on"
      - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
        value: ${{ oidc.discoveryUrl }}
      - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
        valueFrom: {secretKeyRef: {name: "${{ platform.oidcClientSecret }}", key: client_id}}
      - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
        valueFrom: {secretKeyRef: {name: "${{ platform.oidcClientSecret }}", key: client_secret}}
      - name: RUSTFS_IDENTITY_OPENID_SCOPES
        value: ${{ oidc.scopes }}
      - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
        value: ${{ oidc.redirectUri }}
      - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
        value: "off"
      - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
        value: ${{ oidc.displayName }}
      - name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME
        value: ${{ values.oidcPolicyClaim }}
      - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
        value: ${{ values.oidcPolicyClaim }}
      - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
        value: preferred_username
      - name: RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM
        value: email
  extraVolumes:
    $if: ${{ platform.oidc.enabled }}
    $value:
      - name: cacerts
        secret:
          secretName: ${{ values.caBundleSecret }}
  extraVolumeMounts:
    $if: ${{ platform.oidc.enabled }}
    $value:
      - name: cacerts
        mountPath: /cacerts
