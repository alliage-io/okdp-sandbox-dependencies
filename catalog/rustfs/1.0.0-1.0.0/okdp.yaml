# OKDP's part of rustfs (okdp-compiler): the platform values it needs, OKDP's
# defaults of its chart and what an instance may override; then the mapping
# besides the chart's values (values.cel.yaml).

roles: [storage]
dependsOn: [ingress, external-secrets]
# Platform values the service needs, under global.okdp (oidc.issuerUri too,
# when OIDC is on: an errors check of the mapping).
require:
  - ingress.suffix
  - ingress.className
  - certificateIssuers.selfSigned.name
  - storageClass.data
defaults:
  rustfs: rustfs.defaults.yaml
upstream:
  # The instance's upstream.rustfs. What the platform relies on: the names
  # and ports the s3 connection, the provisioning Job and the ingresses
  # address (<release>-svc, 9000 and 9001); the root identity (secret: the
  # ESO-generated Secret the provisioning Job also reads); the exposure, owned
  # by OKDP's ingresses (the console host is registered with the identity
  # provider): the upstream ingress and Gateway API routes; and
  # extraManifests (arbitrary objects through tpl, replaced by OKDP's own
  # objects).
  rustfs:
    protect: [nameOverride, fullnameOverride, service.endpoint.port, service.console.port,
              config.rustfs.address, config.rustfs.console_address, secret, ingress,
              gatewayApi, extraManifests]
    # The lists carrying the OIDC client Secret and the CA bundle: an instance
    # adds to them.
    append: [extraEnv, extraVolumes, extraVolumeMounts]
# The former module oidc-dcr is not a dependency: the compiler adds the chart
# oidc-dcr of the mapping's oidcClients (global.okdp.oidc.clientProvisioning:
# dcr).

# The mapping of rustfs: the values of its upstream chart (the former KuboCD
# module main) are in values.cel.yaml, the fixed ones in rustfs.defaults.yaml;
# its OAuth client (oidcClients, the former module oidc-dcr), OKDP's own
# objects (the ingresses and the provisioning Job, formerly upstream
# extraManifests, and the generated root identity), and what the instance
# publishes (with the generated credentials of the s3 output), below. The
# OIDC provider, formerly registered by the provisioning job (mc admin config
# set), is set in the server's environment.
# ${{ ... }} is a CEL expression; the shell's ${VAR} and $(...) and ESO's {{ }}
# stay literal.
vars:
  suffix: ${{ global.okdp.ingress.suffix }}
  # Instance name: the release name without its project prefix. Hosts derive
  # from it, never from the product name, so a store deployed under a neutral
  # name takes over that name's hosts (instance "storage" in "default" serves
  # storage-default). The console prefixes instances with their project,
  # which would double the namespace: it is stripped.
  instance: >-
    ${{ release.name.startsWith(release.namespace + '-')
        ? release.name.substring(size(release.namespace) + 1) : release.name }}
  # Console host: <consoleHost>.<suffix>, default <instance>-<namespace>.<suffix>.
  consoleHost: >-
    ${{ values.consoleHost != '' ? values.consoleHost + '.' + suffix
        : instance + '-' + release.namespace + '.' + suffix }}
  # S3 API host: <apiHost>.<suffix>, default <instance>-<namespace>-api.<suffix>.
  s3Host: >-
    ${{ values.apiHost != '' ? values.apiHost + '.' + suffix
        : instance + '-' + release.namespace + '-api.' + suffix }}
  # Image tag of the server, also run by the provisioning Job (curl).
  imageTag: 1.0.0
  # Service of the server (upstream naming, fullnameOverride = release).
  service: ${{ release.name }}-svc
  # In-cluster S3 endpoint.
  internalUrl: http://${{ service }}.${{ release.namespace }}.svc.cluster.local:9000
  # Secret holding the root identity (RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY):
  # <release>-root, generated by ESO, unless rootSecretKey is set, in which
  # case the upstream chart writes <release>-secret from the values.
  rootSecret: >-
    ${{ values.rootSecretKey != '' ? release.name + '-secret' : okdpFullname('root') }}
  # Credentials Secret of the s3 output (accessKey/secretKey): outputSecretRef
  # when set (an identity of the store, a grant), else
  # <release>-s3-credentials, generated by ESO (provides) and provisioned by
  # the chart.
  credentialsSecret: ${{ first([values.outputSecretRef, okdpFullname('s3-credentials')]) }}
  # OIDC settings: the scopes (platform scopes plus oidcPolicyScope), the
  # issuer origin (the server's SSRF guard refuses private origins unless
  # allowed), the display name and the redirect URI. Read only when
  # platform.oidc.enabled.
  oidcScope: >-
    ${{ platform.oidc.scope + (values.oidcPolicyScope != '' ? ' ' + values.oidcPolicyScope : '') }}
  issuerUri: ${{ platform.oidc.?issuerUri.orValue('') }}
  oidc:
    discoveryUrl: ${{ issuerUri }}/.well-known/openid-configuration
    scopes: ${{ oidcScope.replace(' ', ',') }}
    origin: >-
      ${{ cel.bind(parts, issuerUri.split('/'), parts.size() > 2 ? parts[0] + '//' + parts[2] : '') }}
    displayName: ${{ first([platform.oidc.?displayName.orValue(''), 'keycloak']) }}
    redirectUri: https://${{ consoleHost }}/rustfs/admin/v3/oidc/callback/default

  # IAM statements for neutral verbs on buckets. Verbs are matched
  # case-insensitively: the same grants block applies to any store backend,
  # whatever casing its own chart documents. RustFS rejects s3: and admin:
  # actions mixed in one statement.
  verbActions:
    read: ["s3:GetObject", "s3:GetBucketLocation"]
    list: ["s3:ListBucket", "s3:ListAllMyBuckets"]
    write: ["s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload"]
  # The grants, with their index (variables G<index>_AK/G<index>_SK, file
  # policy-grant-<index>.json, so any principal name works) and their lower-cased
  # verbs; admin (an admin verb, or sts): full admin rights (consoleAdmin), no
  # policy of their own.
  grants:
    - $for: "x in values.grants.transformList(i, g, {'index': i, 'grant': g})"
      $vars:
        verbs: ${{ x.grant.?actions.orValue([]).map(v, v.lowerAscii()) }}
      $each:
        index: ${{ str(x.index) }}
        principal: ${{ x.grant.principal }}
        secret: ${{ x.grant.credentialsSecret }}
        verbs: ${{ verbs }}
        buckets: ${{ x.grant.?buckets.orValue([]) }}
        admin: ${{ x.grant.?sts.orValue(false) == true || 'admin' in verbs }}
  # The policies to write: one per non-admin grant, the identity of the s3
  # output (generated: read, list, write on every bucket), one per OIDC
  # policy, named after the claim value.
  policies:
    - $for: g in grants.filter(g, !g.admin)
      $each:
        file: policy-grant-${{ g.index }}.json
        verbs: ${{ g.verbs }}
        buckets: ${{ g.buckets }}
        admin: false
    - $if: ${{ values.outputSecretRef == '' }}
      file: policy-s3-credentials.json
      verbs: [read, list, write]
      buckets: []
      admin: false
    - $for: p in values.oidcPolicies
      $vars:
        verbs: ${{ p.?actions.orValue([]).map(v, v.lowerAscii()) }}
      $each:
        file: oidc-policy-${{ p.name }}.json
        verbs: ${{ verbs }}
        buckets: ${{ p.?buckets.orValue([]) }}
        admin: ${{ 'admin' in verbs }}
  # The files of the provisioning ConfigMap besides the script: the policies
  # as IAM JSON documents, and the anonymous download policy of the
  # anonymousRead buckets (mc anonymous set download).
  policyFiles:
    - $for: p in policies
      $vars:
        # Every bucket by default.
        resources: >-
          ${{ first([p.buckets, ['*']])
              .map(b, b == '*' ? ['arn:aws:s3:::*', 'arn:aws:s3:::*/*'] : ['arn:aws:s3:::' + b, 'arn:aws:s3:::' + b + '/*'])
              .flatten().distinct() }}
        actions: >-
          ${{ p.verbs.map(v, v in verbActions ? verbActions[v] : []).flatten().distinct() }}
        statements: >-
          ${{ p.admin
              ? [{'Effect': 'Allow', 'Action': ['s3:*'], 'Resource': resources},
                 {'Effect': 'Allow', 'Action': ['admin:*'], 'Resource': ['arn:aws:s3:::*']}]
              : [{'Effect': 'Allow', 'Action': actions, 'Resource': resources}] }}
      $each:
        name: ${{ p.file }}
        content: |
          ${{ toJson({'Version': '2012-10-17', 'Statement': statements}) }}
    - $for: b in values.buckets.filter(b, b.?anonymousRead.orValue(false) == true)
      $each:
        name: bucket-${{ b.name }}.json
        content: |
          ${{ toJson({'Version': '2012-10-17', 'Statement': [
                {'Effect': 'Allow', 'Principal': {'AWS': ['*']}, 'Action': ['s3:GetBucketLocation'],
                 'Resource': ['arn:aws:s3:::' + b.name]},
                {'Effect': 'Allow', 'Principal': {'AWS': ['*']}, 'Action': ['s3:GetObject'],
                 'Resource': ['arn:aws:s3:::' + b.name + '/*']}]}) }}
  # The provisioning steps, one shell line each.
  steps:
    - $if: ${{ values.buckets.size() > 0 }}
      $value: echo ">> creating buckets"
    - $for: b in values.buckets
      $each:
        - call PUT /${{ b.name }}
        - $if: ${{ b.?anonymousRead.orValue(false) == true }}
          $value: call PUT /${{ b.name }} --url-query policy= --data-binary @/policies/bucket-${{ b.name }}.json
        # S3 has no directories: consumers that require a prefix to exist
        # before they write to it (e.g. Spark's FsHistoryProvider) need an
        # empty marker. The path is trimmed of its leading and trailing "/".
        - $for: p in b.?paths.orValue([])
          $vars:
            path: >-
              ${{ cel.bind(parts, p.split('/'), cel.bind(kept, parts.transformList(i, s, s != '', i),
                  kept.size() == 0 ? '' : parts.slice(kept[0], kept[kept.size() - 1] + 1).join('/'))) }}
          $each: call PUT /${{ b.name }}/${{ path }}/.keep --data-binary ''
    - $if: ${{ grants.size() > 0 }}
      $value: echo ">> creating users and policies from grants"
    - $for: g in grants
      $each: >-
        ${{ g.admin
            ? ['echo "   ' + g.principal + ' (admin/sts: consoleAdmin)"',
               'add_user "$G' + g.index + '_AK" "$G' + g.index + '_SK" consoleAdmin']
            : ['echo "   ' + g.principal + ' (okdp-' + g.principal + ')"',
               'add_policy okdp-' + g.principal + ' /policies/policy-grant-' + g.index + '.json',
               'add_user "$G' + g.index + '_AK" "$G' + g.index + '_SK" okdp-' + g.principal] }}
    - $for: "x in (values.outputSecretRef == '' ? [credentialsSecret] : [])"
      $each:
        - echo ">> creating the identity of the s3 output (${{ x }})"
        - add_policy okdp-s3-credentials /policies/policy-s3-credentials.json
        - add_user "$OUT_AK" "$OUT_SK" okdp-s3-credentials
    - $if: ${{ values.oidcPolicies.size() > 0 }}
      $value: echo ">> creating OIDC policies (claim values map onto these names)"
    - $for: p in values.oidcPolicies
      $each: add_policy ${{ p.name }} /policies/oidc-policy-${{ p.name }}.json

  # The provisioning ConfigMap and Job.
  provision: ${{ okdpFullname('provision') }}
  provisionLabels: ${{ okdpLabels('provision') }}
  # The provisioning script.
  script: |
    #!/bin/sh
    set -eu
    endpoint="http://${{ service }}.${{ release.namespace }}:9000"
    # call <method> <path> [curl args]: a request signed with the root identity;
    # fails with the server's answer on an HTTP error.
    call() {
      method=$1; path=$2; shift 2
      out=$(curl -sS --fail-with-body --aws-sigv4 "aws:amz:us-east-1:s3" --user "${ROOT_AK}:${ROOT_SK}" \
        -X "${method}" "$@" "${endpoint}${path}") || { echo "!! ${method} ${path}: ${out}" >&2; return 1; }
    }
    json_string() { printf '"%s"' "$(printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g')"; }
    # add_user <access key> <secret key> <policy>: creates or updates the user, sets its policy.
    add_user() {
      call PUT /rustfs/admin/v3/add-user --url-query "accessKey=$1" \
        --data-binary "{\"secretKey\":$(json_string "$2"),\"status\":\"enabled\"}"
      call PUT /rustfs/admin/v3/set-user-or-group-policy \
        --url-query "policyName=$3" --url-query "userOrGroup=$1" --url-query "isGroup=false"
    }
    add_policy() { call PUT /rustfs/admin/v3/add-canned-policy --url-query "name=$1" --data-binary "@$2"; }

    echo ">> waiting for RustFS at ${endpoint} ..."
    deadline=$(( $(date +%s) + 300 ))
    until call GET / 2>/dev/null; do
      if [ "$(date +%s)" -ge "${deadline}" ]; then
        call GET /
        exit 1
      fi
      sleep 3
    done
    ${{ steps.map(l, l + '\n').join('') }}echo ">> provisioning complete"

errors:
  - $if: ${{ platform.oidc.enabled == true && issuerUri == '' }}
    $value: >-
      rustfs: global.okdp.oidc.issuerUri is required when OIDC is enabled. It is a
      platform value: set it in platform/platform-values.yaml (--context).

# The OAuth client (the former module oidc-dcr), registered by dynamic client
# registration in dcr mode (global.okdp.oidc.clientProvisioning: dcr): the
# compiler adds the chart oidc-dcr (Job <release>-oidc-dcr), which writes the
# Secret platform.oidcClientSecret (<release>-<namespace>-dcr). Nothing in
# existing mode.
oidcClients:
  # Named after what the DNS shows, not after the release; the policy claim
  # rides its own scope, which the platform scopes do not carry; the CA bundle
  # the Job trusts is the instance's (caBundleSecret).
  - clientName: ${{ instance }}-${{ release.namespace }}
    redirectUris: ['${{ oidc.redirectUri }}']
    grantTypes: [authorization_code, refresh_token, client_credentials]
    scope: ${{ oidcScope }}
    caSecret: ${{ values.caBundleSecret }}

# OKDP's own objects, rendered by the umbrella (okdp.objects.yaml) after the
# credentials Secret of the s3 output.
objects:
  # S3 API (endpoint port 9000) and console (port 9001) ingresses.
  - $for: "i in [{'name': 's3', 'host': s3Host, 'port': 'endpoint'}, {'name': 'console', 'host': consoleHost, 'port': 'console'}]"
    $each:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ${{ okdpFullname(i.name) }}
        namespace: ${{ release.namespace }}
        labels: ${{ okdpLabels(i.name) }}
        annotations:
          $merge: ${{ platform.ingressAnnotations }}
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
      spec:
        ingressClassName: ${{ global.okdp.ingress.className }}
        rules:
          - host: ${{ i.host }}
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: ${{ service }}
                      port:
                        name: ${{ i.port }}
        tls:
          - hosts:
              - ${{ i.host }}
            secretName: ${{ okdpFullname(i.name + '-tls') }}

  # Provisioning: buckets, the S3 identities of the grants and their
  # policies, the identity of the s3 output (credentials Secret) and the
  # policies named after the OIDC claim values. A post-install/post-upgrade
  # hook (Argo: PostSync): the server it polls is a regular resource
  # applied first, and the Job re-runs on every sync, so a changed input
  # (rotated keys, new grants, edited policies) is always applied. Every
  # call is idempotent: an existing bucket is kept, a user or a policy is
  # overwritten.
  #
  # It runs the store's own image: curl signs the requests (SigV4) with the
  # root identity, the S3 API creates the buckets and the RustFS admin API
  # (/rustfs/admin/v3, plain JSON) the users and policies. Replaces the
  # MinIO client (quay.io/minio/mc, archived).
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${{ provision }}
      namespace: ${{ release.namespace }}
      labels: ${{ provisionLabels }}
    data:
      $for: "f in policyFiles + [{'name': 'provision.sh', 'content': script}]"
      $key: ${{ f.name }}
      $value: ${{ f.content }}
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: ${{ provision }}
      namespace: ${{ release.namespace }}
      labels: ${{ provisionLabels }}
      annotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-delete-policy: before-hook-creation
    spec:
      backoffLimit: 20
      template:
        metadata:
          labels: ${{ provisionLabels }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: provision
              image: rustfs/rustfs:${{ imageTag }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/provision.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop: [ALL]
              env:
                - name: ROOT_AK
                  valueFrom: {secretKeyRef: {name: "${{ rootSecret }}", key: RUSTFS_ACCESS_KEY}}
                - name: ROOT_SK
                  valueFrom: {secretKeyRef: {name: "${{ rootSecret }}", key: RUSTFS_SECRET_KEY}}
                - $for: "s in (values.outputSecretRef == '' ? [credentialsSecret] : [])"
                  $each:
                    - name: OUT_AK
                      valueFrom: {secretKeyRef: {name: "${{ s }}", key: accessKey}}
                    - name: OUT_SK
                      valueFrom: {secretKeyRef: {name: "${{ s }}", key: secretKey}}
                - $for: g in grants
                  $each:
                    - name: G${{ g.index }}_AK
                      valueFrom:
                        secretKeyRef:
                          name: ${{ g.secret.name }}
                          key: ${{ first([g.secret.?accessKeyKey.orValue(''), 'accessKey']) }}
                    - name: G${{ g.index }}_SK
                      valueFrom:
                        secretKeyRef:
                          name: ${{ g.secret.name }}
                          key: ${{ first([g.secret.?secretKeyKey.orValue(''), 'secretKey']) }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: policies
                  mountPath: /policies
          volumes:
            - name: scripts
              configMap:
                name: ${{ provision }}
                items:
                  - key: provision.sh
                    path: provision.sh
            - name: policies
              configMap:
                name: ${{ provision }}

  # Root identity, generated once in the cluster (an ESO Password generator
  # and the ExternalSecret writing the Secret) unless rootSecretKey is set.
  # The keys are the ones the server reads (envFrom).
  - $spread: >-
      ${{ values.rootSecretKey != '' ? [] : okdpGeneratedSecret({'name': rootSecret,
          'keys': [{'key': 'RUSTFS_SECRET_KEY', 'length': 40, 'symbols': 0}],
          'stringData': {'RUSTFS_ACCESS_KEY': values.rootAccessKey}}) }}

# okdp.info.yaml, listed by the console: the console URL.
instance:
  url: https://${{ consoleHost }}
  usage: |
    RustFS S3-compatible object storage.

    - S3 endpoint: https://${{ s3Host }}
    - In-cluster: `${{ internalUrl }}`
    - Console: https://${{ consoleHost }}

    The s3 output `${{ release.name }}` is published with the credentials Secret
    `${{ credentialsSecret }}`${{ values.outputSecretRef == '' ? ' (read/list/write on every\nbucket)' : '' }}. An instance of this namespace references it by that name;
    consumers of another namespace declare a connection file
    (`projects/<project>/connections/<name>.yaml`) with these endpoints and their
    own identity (a grant of this store).

# The connection this instance publishes, named after the release. s3 has no
# internal naming convention: an instance of the namespace references it by that
# name, consumers of another namespace declare a connection file with these
# values and their own identity.
provides:
  - contract: s3
    values:
      apiUrl: https://${{ s3Host }}
      internalUrl: ${{ internalUrl }}
      consoleUrl: https://${{ consoleHost }}
      region: us-east-1
      pathStyle: true
    secretRef:
      name: ${{ credentialsSecret }}
    # Unless outputSecretRef names one, the credentials Secret is generated
    # once by ESO (rendered by the compiler, labelled okdp.io/credentials-s3).
    secret:
      $if: ${{ values.outputSecretRef == '' }}
      generate:
        - {key: accessKey, length: 20, symbols: 0}
        - {key: secretKey, length: 40, symbols: 0}
