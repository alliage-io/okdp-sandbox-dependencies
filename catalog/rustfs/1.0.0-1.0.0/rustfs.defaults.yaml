# OKDP's defaults of the rustfs chart (okdp.yaml defaults), the same for
# every instance: over the chart's values.yaml, under the values computed
# by values.cel.yaml. Plain YAML, not a template.
# Single node (standalone).
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false
replicaCount: 1
resources:
  requests:
    memory: 512Mi
storageclass:
  logStorageSize: 256Mi
# The upstream ingress targets the console port only: both ingresses (S3 API
# and console) are OKDP's objects (okdp.yaml).
ingress:
  enabled: false
